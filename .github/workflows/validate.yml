name: Validate HalalFrFr Skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Regenerate derived files
        shell: pwsh
        run: |
          ./scripts/sync-resource-intelligence.ps1
          ./scripts/sync-skill-registry.ps1

      - name: Verify generated files are committed
        shell: bash
        run: git diff --exit-code

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-repo.ps1

      - name: Audit description overlap
        shell: pwsh
        run: ./scripts/audit-description-overlap.ps1
